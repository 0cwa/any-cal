title = "Any-Cal secret scanning"

# Use the upstream rules and exclude only untracked outputs that are never
# publication inputs. `scripts/security/check-public-tree.sh` rejects these
# paths if they appear in the index or reachable history, so this allowlist
# cannot turn a tracked private/generated path into a publication blind spot.
[extend]
useDefault = true

[allowlist]
description = "Generated or private workspace state excluded from the public tree"
paths = [
  '''(^|/)\.local(?:/|$)''',
  '''(^|/)tmp(?:/|$)''',
  '''(^|/)target(?:/|$)''',
  '''(^|/)android/.*/build(?:/|$)''',
  '''(^|/)android/.*/\.gradle(?:/|$)''',
  '''(^|/)\.gradle(?:/|$)''',
  '''(^|/)scripts/__pycache__(?:/|$)''',
]
