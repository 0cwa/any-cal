name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to immutable release commit SHAs rather than floating branches. The
# security workflow performs the repository-wide credential scan separately.
jobs:
  rust:
    name: rust-${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: macos-arm64
            os: macos-14
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      TMPDIR: ${{ github.workspace }}/tmp
      ANY_CAL_TMP_ROOT: ${{ github.workspace }}/tmp
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare repository-local temporary tree
        run: mkdir -p "$TMPDIR"

      - name: Check documentation structure
        if: matrix.name == 'linux-x86_64'
        run: bash scripts/docs/check-structure.sh

      - name: Restore Cargo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-

      - name: Fetch locked dependencies
        run: env -u LD_PRELOAD cargo fetch --locked

      - name: Check formatting
        run: env -u LD_PRELOAD cargo fmt --all -- --check

      - name: Run workspace tests
        run: env -u LD_PRELOAD cargo test --workspace --offline --locked

      - name: Run Clippy
        run: env -u LD_PRELOAD cargo clippy --workspace --all-targets --offline --locked -- -D warnings

      - name: Exercise user-local packaging
        run: env -u LD_PRELOAD scripts/test-packaging.sh

  android:
    name: android-api35
    runs-on: ubuntu-24.04
    env:
      CARGO_TERM_COLOR: always
      ANDROID_NDK_VERSION: 27.2.12479018
      GRADLE_VERSION: 8.10.2
      CARGO_NDK_VERSION: 4.1.2
      TMPDIR: ${{ github.workspace }}/tmp
      CARGO_TARGET_DIR: ${{ github.workspace }}/tmp/cargo-target
      GRADLE_USER_HOME: ${{ github.workspace }}/tmp/gradle-home
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare repository-local temporary tree
        run: mkdir -p "$TMPDIR"

      - name: Validate offline Android probe
        run: scripts/android-probe/validate.sh

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install Android API, build tools, and NDK
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;34.0.0' \
            "ndk;${ANDROID_NDK_VERSION}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Add Android Rust targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Build native bridge and Android APKs
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          export GRADLE_BIN=gradle
          export NATIVE_CRATE_DIR="$GITHUB_WORKSPACE/crates/android-bridge"
          env -u LD_PRELOAD scripts/android-build/build-and-test.sh

      - name: Upload Android release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: any-cal-android-api35
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
