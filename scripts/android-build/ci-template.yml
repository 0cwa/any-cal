# The canonical workflow is .github/workflows/package.yml. This small template
# mirrors its Android prerequisites for another CI system. No secrets or live
# services are required.
name: android-build-validation

on:
  workflow_dispatch:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      CARGO_NDK_VERSION: '4.1.2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;34.0.0' 'ndk;27.2.12479018'
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
        with:
          gradle-version: '8.10.2'
      - run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$ANDROID_HOME"
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export NATIVE_CRATE_DIR="$GITHUB_WORKSPACE/crates/android-bridge"
          env -u LD_PRELOAD scripts/android-build/build-and-test.sh
